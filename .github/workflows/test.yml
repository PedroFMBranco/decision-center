name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      # The tmux tests skip themselves when tmux is missing.
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq tmux
      - run: npm ci
      - run: npm test
